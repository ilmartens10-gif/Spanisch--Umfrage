
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umfrage</title>
<style>
  :root {
    --bg: #eef2f5;
    --card: #ffffff;
    --ink: #1c2b33;
    --muted: #5d6f79;
    --line: #cfd9df;
    --accent: #0f6b6b;
    --accent-dark: #0a4f4f;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.55;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .topbar { display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-bottom:20px; font-family:system-ui,sans-serif; }
  .language { display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--muted); }
  .language select { width:auto; min-width:170px; padding:8px 10px; }
  .scale-box { font-family:system-ui,sans-serif; }
  .scale-value { display:flex; justify-content:center; align-items:center; gap:8px; margin:8px 0 12px; font-size:1.25rem; font-weight:700; color:var(--accent); }
  .scale-range { width:100%; }
  .scale-number { width:78px !important; padding:6px 8px !important; text-align:center; }
  .scale-labels { display:flex; justify-content:space-between; color:var(--muted); font:.82rem system-ui,sans-serif; margin-top:6px; }

  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .counter { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: 8px 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 24px;
  }
  .section { font-family: system-ui, sans-serif; font-size: .9rem; color: var(--accent); margin: 0 0 6px; font-weight: 600; }
  .question { font-size: 1.25rem; margin: 0 0 18px; font-weight: normal; }
  .hint { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: -10px 0 14px; }

  .options { display: flex; flex-direction: column; gap: 8px; font-family: system-ui, sans-serif; }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .option:hover { border-color: var(--accent); }
  .option:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .option input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    font: 1rem system-ui, sans-serif;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .extra { margin-top: 14px; }
  .extra label { display: block; font-family: system-ui, sans-serif; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }

  :focus-visible { outline: 3px solid #7cc4c4; outline-offset: 2px; }

  .error { color: var(--error); font-family: system-ui, sans-serif; font-size: .9rem; margin: 12px 0 0; min-height: 1.3em; }

  .nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 12px; }
  button {
    font: 600 1rem system-ui, sans-serif;
    padding: 12px 22px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: transparent; color: var(--accent); }
  .btn-secondary:hover { background: #e6f2f2; }
  button:disabled { opacity: .4; cursor: default; }

  .result h2 { margin-top: 0; }
  .result dl { font-family: system-ui, sans-serif; margin: 0 0 20px; }
  .result dt { font-weight: 600; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .result dd { margin: 2px 0 0; }

  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
  textarea {
    width: 100%; padding: 12px 14px; font: 1rem system-ui, sans-serif; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; background: #fff; resize: vertical;
  }
  .scale .ends { display: flex; justify-content: space-between; gap: 12px; font: .85rem system-ui, sans-serif; color: var(--muted); margin-bottom: 8px; }
  .pts { display: flex; gap: 8px; }
  .pt { flex: 1; display: flex; justify-content: center; padding: 14px 0; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .pt:hover { border-color: var(--accent); }
  .pt:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .pt input { accent-color: var(--accent); width: 20px; height: 20px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">Umfrage</h1>
  <p class="sub" id="subtitle">Fragen zur Person, zum Sprachgebrauch und zum Spracherwerb</p>
  <div class="topbar">
    <label class="language" for="language-select"><span id="language-label">Sprache</span>
      <select id="language-select">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="kk">Қазақша</option>
      </select>
    </label>
  </div>

  <div id="progress-wrap">
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="bar"></div></div>
    <p class="counter" id="counter"></p>
  </div>

  <section class="card" id="card" aria-live="polite"></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
window.saveAnswers = a => addDoc(collection(db, "responses"), { ...a, createdAt: serverTimestamp() });
</script>
<script src="./survey-i18n.js"></script>
<script>
// ---------- Fragen / Logik ----------
const LANGS = { en:"English", es:"Español", ru:"Русский", uk:"Українська", kk:"Қазақша" };
const I18N = window.SURVEY_I18N;
let currentLang = (()=>{try{const v=localStorage.getItem("surveyLanguage");return LANGS[v]?v:"en";}catch(_){return "en";}})();

const REGION_HAS_REGIONAL_LANGUAGE = {
  "Andalusien":false,"Aragonien":true,"Asturien":true,"Balearische Inseln":true,"Baskenland":true,
  "Valencia":true,"Galicien":true,"Kanarische Inseln":false,"Kantabrien":false,"Kastilien-La Mancha":false,
  "Kastilien und León":false,"Katalonien":true,"Madrid":false,"Murcia":false,"Navarra":true,"La Rioja":false,
  "Extremadura":false,"Ceuta":false,"Melilla":false
};

const questions = [
  {section:"Fragen zur Person",id:"alter",type:"number",text:"Wie alt sind Sie?",min:1,max:120},
  {section:"Fragen zur Person",id:"geschlecht",type:"radio",text:"Kennzeichnen Sie Ihr Geschlecht:",options:["männlich","weiblich","divers"]},
  {section:"Fragen zur Person",id:"bildung",type:"radio",text:"Über welchen höchsten Bildungsgrad verfügen Sie?",options:["Ich bin im Kindergarten","Ich bin in der Grundschule (Klasse unten angeben)","Ich bin in der Sekundarstufe (Klasse unten angeben)","Schule abgeschlossen","Ich besuche / habe abgeschlossen die Berufsschule (ПТУ)","Ich mache / habe abgeschlossen den Bachelor","Ich mache / habe abgeschlossen den Master"],extra:{id:"bildung_praezisierung",label:"Präzisierung (z. B. Klasse):"}},
  {section:"Fragen zur Person",id:"herkunft",type:"text",text:"Aus welchem Land kommen Sie ursprünglich?"},
  {section:"Fragen zur Person",id:"selbstbild",type:"text",text:"Wie nehmen Sie sich persönlich wahr? Identifizieren Sie sich mit einem Begriff.",hint:"z. B. Russe; Tatare; Ukrainer; Huzule; Katalaner; Europäer; Uraler etc."},
  {section:"Fragen zur Person",id:"wohnsituation",type:"radio",text:"Mit wem wohnen Sie zusammen?",options:["Allein","Mit meinem Partner","Mit meinem Partner und Kindern","Mit meinen Kindern","Mit meinen Eltern","Sonstiges"],extra:{id:"partner_identifikation",label:"Falls ein Partner da ist, identifizieren Sie ihn:"}},
  {section:"Fragen zur Person",id:"dauer_spanien",type:"text",text:"Wie lange wohnen Sie in Spanien?"},
  {section:"Fragen zur Person",id:"region",type:"select",text:"Ich wohne zurzeit in:",options:["Andalusien","Aragonien","Asturien","Balearische Inseln","Baskenland","Valencia","Galicien","Kanarische Inseln","Kantabrien","Kastilien-La Mancha","Kastilien und León","Katalonien","Madrid","Murcia","Navarra","La Rioja","Extremadura","Ceuta","Melilla"]},
  {section:"Fragen zur Person",id:"bleiben",type:"radio",text:"Haben Sie vor, in Spanien / einem spanischsprachigen Land ansässig zu werden?",options:["Definitiv","Gut wahrscheinlich","Eher nicht","Auf gar keinen Fall","Weiß ich noch nicht"]},
  {section:"Fragen zum Sprachgebrauch im Alltag",id:"muttersprache",type:"checkbox",text:"Welche Sprache/n empfinden Sie als Ihre Muttersprache?",hint:"Mehr als eine Antwort möglich.",options:["Russisch","Ukrainisch","Weißrussisch"],other:true},
  {section:"Fragen zum Sprachgebrauch im Alltag",id:"partner_sprache",type:"checkbox",text:"Mit meinem Partner spreche ich …",hint:"Mehr als eine Antwort möglich.",options:["Russisch","Ukrainisch","Weißrussisch"],other:true,showIf:{id:"wohnsituation",values:["Mit meinem Partner","Mit meinem Partner und Kindern"]}},
  {section:"Fragen zum Sprachgebrauch im Alltag",id:"kinder_sprache",type:"checkbox",text:"Mit meinem/n Kind/ern spreche ich …",hint:"Mehr als eine Antwort möglich.",options:["Russisch","Ukrainisch","Weißrussisch"],other:true,showIf:{id:"wohnsituation",values:["Mit meinem Partner und Kindern","Mit meinen Kindern"]}},
  {section:"Fragen zum Sprachgebrauch im Alltag",id:"eltern_sprache",type:"checkbox",text:"Mit meinen Eltern spreche ich …",hint:"Mehr als eine Antwort möglich.",options:["Russisch","Ukrainisch","Weißrussisch","Trifft nicht zu"],other:true,exclusive:"Trifft nicht zu"},
  {section:"Fragen zum Sprachgebrauch im Alltag",id:"freunde_sprache",type:"radio",text:"In meinem engsten Freundeskreis wird überwiegend … gesprochen.",options:["Russisch","Ukrainisch","Weißrussisch","Kastilisch","Englisch"],other:true},
  {section:"Fragen zum Sprachgebrauch im Alltag",id:"arbeit_sprache",type:"radio",text:"Bei der Arbeit / in der Ausbildungsstätte spreche ich überwiegend …",options:["Russisch","Ukrainisch","Weißrussisch","Kastilisch","Englisch"],other:true},
  {section:"Fragen zum Sprachgebrauch im Alltag",id:"kastilisch_sprechen",type:"radio",text:"Sprechen Sie Kastilisch?",options:["Ja","Nein"],extra:{id:"kastilisch_niveau",label:"Mit dem Niveau (wenn kein offizielles Abzeichen vorhanden ist, dann geschätzt):"}},
  {section:"Fragen zum Spracherwerb",id:"fremdsprachen",type:"textarea",text:"Welche weiteren Fremdsprachen beherrschen Sie?",hint:"Zählen Sie bitte auf, am besten mit dem Abzeichen. Falls keine, schreiben Sie „keine“."},
  {section:"Fragen zum Spracherwerb",id:"kastilisch_gelernt",type:"textarea",text:"Wie haben Sie Kastilisch gelernt? / Wie lernen Sie Kastilisch?"},
  {section:"Fragen zum Spracherwerb",id:"k_bildung",type:"scale",text:"Wie sicher sprechen Sie Kastilisch in der Bildungsstätte?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_arbeit",type:"scale",text:"Wie sicher sprechen Sie Kastilisch bei der Arbeit?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_einkaufen",type:"scale",text:"Wie sicher sprechen Sie Kastilisch beim Einkaufen?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_cafe",type:"scale",text:"Wie sicher sprechen Sie Kastilisch in Cafés/Restaurants/Friseursalons/etc.?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_freunde",type:"scale",text:"Wie sicher sprechen Sie Kastilisch mit kastilischsprachigen Freunden/Bekannten?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_strasse",type:"scale",text:"Wie sicher sprechen Sie Kastilisch mit zufälligen Personen auf der Straße?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_amt",type:"scale",text:"Wie sicher sprechen Sie Kastilisch in offiziellen Einrichtungen (z. B. Rathaus)?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_telefon",type:"scale",text:"Wie sicher sprechen Sie Kastilisch am Telefon?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_email",type:"scale",text:"Wie sicher schreiben Sie Kastilisch in E-Mails?",left:"sehr sicher",right:"sehr unsicher"},
  {section:"Fragen zum Spracherwerb",id:"k_lesen",type:"radio",text:"Lesen Sie eigenständig Literatur auf Kastilisch?",options:["ja, fast immer auf Kastilisch","ja, ab und zu","nur selten","gar nicht"]},
  {section:"Fragen zum Spracherwerb",id:"k_schriftlich",type:"scale",text:"Wie gut nehmen Sie Kastilisch schriftlich wahr?",left:"sehr sicher",right:"verstehe gar nichts"},
  {section:"Fragen zum Spracherwerb",id:"k_filme",type:"radio",text:"Schauen Sie Filme/Serien auf Kastilisch an?",options:["ja, fast immer auf Kastilisch","ja, ab und zu","nur selten","gar nicht"]},
  {section:"Fragen zum Spracherwerb",id:"k_musik",type:"radio",text:"Hören Sie Musik auf Kastilisch?",options:["ja, fast immer auf Kastilisch","ja, ab und zu","nur selten","gar nicht"]},
  {section:"Fragen zum Spracherwerb",id:"k_podcasts",type:"radio",text:"Hören Sie Podcasts auf Kastilisch?",options:["ja, fast immer auf Kastilisch","ja, ab und zu","nur selten","gar nicht"]},
  {section:"Fragen zum Spracherwerb",id:"k_audio",type:"scale",text:"Wie gut nehmen Sie akustisch audio- und audiovisuelle Medien auf Kastilisch wahr?",left:"sehr sicher",right:"verstehe gar nichts"},
  {section:"Fragen zum Spracherwerb",id:"k_leben",type:"scale",text:"Wie gut nehmen Sie akustisch kastilischsprachige Menschen im echten Leben wahr?",left:"sehr sicher",right:"verstehe gar nichts"},
  {section:"Fragen zum Spracherwerb",id:"k_influencer",type:"radio",text:"Folgen Sie kastilischsprachigen Influencern/Kanälen in den öffentlichen Medien?",hint:"YouTube, Instagram etc.",options:["Ja, vielen","Ja, einigen","Nein, (fast) keinen"]},
  {section:"Fragen zum Spracherwerb",id:"r_lernen",regionalLanguageRequired:true,type:"radio",text:"Lernen Sie die Regionalsprache Ihrer Autonomie?",options:["Ja","Nein","Meine Region hat keine eigene Regionalsprache"]},
  {section:"Fragen zum Spracherwerb",id:"r_gelernt",regionalLanguageRequired:true,type:"textarea",text:"Wie haben Sie Ihre Regionalsprache gelernt? / Wie lernen Sie Ihre Regionalsprache?",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_bildung",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache in der Bildungsstätte?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_arbeit",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache bei der Arbeit?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_einkaufen",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache beim Einkaufen?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_cafe",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache in Cafés/Restaurants/Friseursalons/etc.?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_freunde",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache mit Freunden/Bekannten?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_strasse",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache mit zufälligen Personen auf der Straße?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_amt",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache in offiziellen Einrichtungen (z. B. Rathaus)?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_telefon",regionalLanguageRequired:true,type:"scale",text:"Wie sicher sprechen Sie Ihre Regionalsprache am Telefon?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_email",regionalLanguageRequired:true,type:"scale",text:"Wie sicher schreiben Sie in Ihrer Regionalsprache E-Mails?",left:"sehr sicher",right:"sehr unsicher",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_lesen",regionalLanguageRequired:true,type:"radio",text:"Lesen Sie eigenständig Literatur in Ihrer Regionalsprache?",options:["ja, fast immer in meiner Regionalsprache","ja, ab und zu","nur selten","gar nicht"],hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_schriftlich",regionalLanguageRequired:true,type:"scale",text:"Wie gut nehmen Sie Ihre Regionalsprache schriftlich wahr?",left:"sehr sicher",right:"verstehe gar nichts",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_filme",regionalLanguageRequired:true,type:"radio",text:"Schauen Sie Filme/Serien in Ihrer Regionalsprache an?",options:["ja, fast immer in meiner Regionalsprache","ja, ab und zu","nur selten","gar nicht"],hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_musik",regionalLanguageRequired:true,type:"radio",text:"Hören Sie Musik in Ihrer Regionalsprache?",options:["ja, fast immer in meiner Regionalsprache","ja, ab und zu","nur selten","gar nicht"],hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_podcasts",regionalLanguageRequired:true,type:"radio",text:"Hören Sie Podcasts in Ihrer Regionalsprache?",options:["ja, fast immer in meiner Regionalsprache","ja, ab und zu","nur selten","gar nicht"],hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_audio",regionalLanguageRequired:true,type:"scale",text:"Wie gut nehmen Sie akustisch audio- und audiovisuelle Medien in Ihrer Regionalsprache wahr?",left:"sehr sicher",right:"verstehe gar nichts",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_leben",regionalLanguageRequired:true,type:"scale",text:"Wie gut nehmen Sie akustisch Menschen in Ihrer Regionalsprache im echten Leben wahr?",left:"sehr sicher",right:"verstehe gar nichts",hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}},
  {section:"Fragen zum Spracherwerb",id:"r_influencer",regionalLanguageRequired:true,type:"radio",text:"Folgen Sie Influencern/Kanälen in Ihrer Regionalsprache in den öffentlichen Medien?",hint:"YouTube, Instagram etc.",options:["Ja, vielen","Ja, einigen","Nein, (fast) keinen"],hideIf:{id:"r_lernen",value:"Meine Region hat keine eigene Regionalsprache"}}
];

const answers = { _scaleVersion:2, umfrage_sprache:currentLang };
let current = 0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));
const dict=()=>I18N[currentLang]||I18N.en;
const tr=s=>dict().common?.[s]||dict().ui?.[s]||s;
const trQ=id=>dict().q?.[id]||questions.find(q=>q.id===id)?.text||id;
const trSection=s=>({"Fragen zur Person":dict().sections.person,"Fragen zum Sprachgebrauch im Alltag":dict().sections.everyday,"Fragen zum Spracherwerb":dict().sections.learning}[s]||s);
const trHint=q=>q.id==="selbstbild"?(dict().hint.selbstbild):(q.hint?tr(q.hint):"");
const trExtra=q=>q.extra?.id==="partner_identifikation"?(dict().extra.partner_identifikation):(q.extra?tr(q.extra.label):"");
const trOption=o=>dict().regions?.[o]||tr(o);
const has=v=>Array.isArray(v)?v.length>0:v!==undefined&&v!==null&&String(v).trim()!=="";
const matches=c=>c.values?c.values.includes(answers[c.id]):answers[c.id]===c.value;
const regionalAvailable=()=>!!REGION_HAS_REGIONAL_LANGUAGE[answers.region];
const visible=i=>{const q=questions[i]; if(q.showIf&&!matches(q.showIf))return false; if(q.regionalLanguageRequired&&!regionalAvailable())return false; if(q.hideIf&&matches(q.hideIf))return false; return true;};
const step=(from,dir)=>{let i=from+dir;while(i>=0&&i<questions.length&&!visible(i))i+=dir;return i;};

const card=document.getElementById('card'),bar=document.getElementById('bar'),counter=document.getElementById('counter'),progress=document.querySelector('.progress'),langSelect=document.getElementById('language-select');
function updateUI(){const d=dict();document.documentElement.lang=currentLang;document.title=d.ui.title;document.getElementById('title').textContent=d.ui.title;document.getElementById('subtitle').textContent=d.ui.subtitle;document.getElementById('language-label').textContent=d.ui.language;langSelect.value=currentLang;}
function optionHTML(type,name,value,checked){return `<label class="option"><input type="${type}" name="${name}" value="${esc(value)}" ${checked?'checked':''}><span>${esc(trOption(value))}</span></label>`;}

function render(){
  const q=questions[current],saved=answers[q.id];let input='';
  if(q.type==='text') input=`<input type="text" id="field" autocomplete="off" value="${esc(saved||'')}">`;
  else if(q.type==='number') input=`<input type="number" id="field" inputmode="numeric" min="${q.min}" max="${q.max}" value="${esc(saved||'')}">`;
  else if(q.type==='select') input=`<select id="field"><option value="">${esc(dict().ui.select)}</option>${q.options.map(o=>`<option value="${esc(o)}" ${saved===o?'selected':''}>${esc(trOption(o))}</option>`).join('')}</select>`;
  else if(q.type==='radio') {const ot=answers[q.id+'_anderes']||'';input=`<div class="options">${q.options.map(o=>optionHTML('radio',q.id,o,saved===o)).join('')}${q.other?optionHTML('radio',q.id,'Anderes',saved==='Anderes'):''}</div>${q.other?`<div class="extra"><input type="text" id="other-text" placeholder="${esc(dict().ui.specify)}" value="${esc(ot)}" aria-label="${esc(dict().ui.otherAnswer)}"></div>`:''}`;}
  else if(q.type==='textarea') input=`<textarea id="field" rows="4">${esc(saved||'')}</textarea>`;
  else if(q.type==='scale'){const hasSaved=Number.isFinite(Number(saved)),score=hasSaved?Math.min(100,Math.max(1,Number(saved))):50,input=`<div class="scale-box"><div class="ends"><span>${esc(tr(q.left))}</span><span>${esc(tr(q.right))}</span></div><div class="scale-value"><output id="scale-output">${hasSaved?score:'–'}</output><span>/ 100</span><input id="scale-number" class="scale-number" type="number" min="1" max="100" step="1" value="${hasSaved?score:''}" aria-label="1 bis 100"></div><input id="scale-range" class="scale-range" type="range" min="1" max="100" step="1" value="${score}" data-touched="${hasSaved?'1':'0'}" aria-label="${esc(trQ(q.id))}"><div class="scale-labels"><span>1</span><span>50</span><span>100</span></div></div>`;}
  else if(q.type==='checkbox'){const list=saved||[],ot=answers[q.id+'_anderes']||'';input=`<div class="options">${q.options.map(o=>optionHTML('checkbox',q.id,o,list.includes(o))).join('')}${q.other?`<label class="option"><input type="checkbox" id="other-check" ${ot?'checked':''}><span>${esc(dict().ui.other)}:</span></label>`:''}</div>${q.other?`<div class="extra"><input type="text" id="other-text" placeholder="${esc(dict().ui.specify)}" value="${esc(ot)}" aria-label="${esc(dict().ui.otherLanguage)}"></div>`:''}`;}

  const extra=(q.extra&&(!q.extra.showIf||matches(q.extra.showIf)))?`<div class="extra"><label for="extra-field">${esc(trExtra(q))}</label><input type="text" id="extra-field" value="${esc(answers[q.extra.id]||'')}"></div>`:'';
  const isLast=step(current,1)>=questions.length;
  card.innerHTML=`<p class="section">${esc(trSection(q.section))}</p><h2 class="question">${current+1}. ${esc(trQ(q.id))}</h2>${trHint(q)?`<p class="hint">${esc(trHint(q))}</p>`:''}${input}${extra}<p class="error" id="error" role="alert"></p><div class="nav"><button type="button" class="btn-secondary" id="back" ${step(current,-1)<0?'disabled':''}>${esc(dict().ui.back)}</button><button type="button" class="btn-primary" id="next">${esc(isLast?dict().ui.finish:dict().ui.next)}</button></div>`;
  const visibility=questions.map((_,i)=>visible(i)),visibleCount=visibility.filter(Boolean).length,visiblePos=visibility.slice(0,current+1).filter(Boolean).length;
  const pct=visibleCount<=1?100:((visiblePos-1)/(visibleCount-1))*100;bar.style.width=pct+'%';progress.setAttribute('aria-valuenow',Math.round(pct));counter.textContent=`${dict().ui.question} ${visiblePos}${dict().ui.of}${visibleCount}`;
  document.getElementById('back').addEventListener('click',goBack);document.getElementById('next').addEventListener('click',goNext);
  const field=document.getElementById('field');if(field&&field.tagName==='INPUT'){field.addEventListener('keydown',e=>{if(e.key==='Enter')goNext();});field.focus();}
  const range=document.getElementById('scale-range'),number=document.getElementById('scale-number'),out=document.getElementById('scale-output');
  if(range&&number&&out){const sync=v=>{let n=Math.round(Number(v));if(!Number.isFinite(n))return;n=Math.min(100,Math.max(1,n));range.value=n;number.value=n;out.textContent=n;range.dataset.touched='1';};range.addEventListener('input',()=>sync(range.value));number.addEventListener('input',()=>sync(number.value));}
  const ot=document.getElementById('other-text');if(ot){ot.addEventListener('input',()=>{const oc=document.getElementById('other-check');if(oc)oc.checked=ot.value.trim()!=='';else if(ot.value.trim()){const r=card.querySelector(`input[name="${q.id}"][value="Anderes"]`);if(r)r.checked=true;}});}
}

function collect(q){
  if(q.type==='radio'){const c=card.querySelector(`input[name="${q.id}"]:checked`);return c?c.value:'';}
  if(q.type==='scale'){const r=document.getElementById('scale-range');if(!r)return '';if(r.dataset.touched!=='1'&&!Number.isFinite(Number(answers[q.id])))return '';return r.value;}
  if(q.type==='checkbox'){const list=[...card.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);const oc=document.getElementById('other-check'),ot=document.getElementById('other-text');if(oc&&oc.checked&&ot.value.trim())list.push('Anderes: '+ot.value.trim());return list;}
  return document.getElementById('field').value.trim();
}
function validate(q,v){
  if(q.type==='checkbox'){const oc=document.getElementById('other-check'),ot=document.getElementById('other-text');if(oc&&oc.checked&&!ot.value.trim())return dict().ui.otherLanguage;if(!v.length)return dict().ui.answers;if(q.exclusive&&v.includes(q.exclusive)&&v.length>1)return `${tr(q.exclusive)} cannot`;return '';}
  if(!v)return(q.type==='radio'||q.type==='select'||q.type==='scale')?dict().ui.answer:dict().ui.answerQuestion;
  if(q.type==='radio'&&q.other&&v==='Anderes'&&!document.getElementById('other-text').value.trim())return dict().ui.otherAnswer;
  if(q.type==='number'){const n=Number(v);if(!Number.isInteger(n)||n<q.min||n>q.max)return `${dict().ui.integer} ${q.min} ${dict().ui.and} ${q.max}.`;}
  if(q.type==='scale'){const n=Number(v);if(!Number.isInteger(n)||n<1||n>100)return dict().ui.scaleError;}
  return '';
}
function save(q,v){answers[q.id]=(q.type==='number'||q.type==='scale')?Number(v):v;if(q.extra){const e=document.getElementById('extra-field');answers[q.extra.id]=e?e.value.trim():'';}if(q.other){const ot=document.getElementById('other-text');answers[q.id+'_anderes']=(q.type==='radio'&&v!=='Anderes')?'':(ot?ot.value.trim():'');}}
function pruneHidden(){questions.forEach((q,i)=>{if(!visible(i)){delete answers[q.id];delete answers[q.id+'_anderes'];if(q.extra)delete answers[q.extra.id];}});}
function goNext(){const q=questions[current],v=collect(q),err=validate(q,v);if(err){document.getElementById('error').textContent=err;return;}save(q,v);answers.umfrage_sprache=currentLang;const n=step(current,1);if(n>=questions.length)return showResult();current=n;render();}
function goBack(){const q=questions[current],v=collect(q);if(has(v)){save(q,v);answers.umfrage_sprache=currentLang;}current=Math.max(step(current,-1),0);render();}
function showResult(){
  pruneHidden();answers._scaleVersion=2;answers.umfrage_sprache=currentLang;bar.style.width='100%';progress.setAttribute('aria-valuenow',100);counter.textContent=dict().ui.done;
  const rows=questions.map((q,i)=>{if(!visible(i))return '';let a=answers[q.id];if(Array.isArray(a))a=a.map(x=>x.startsWith('Anderes:')?dict().ui.otherPrefix+' '+x.slice(9):trOption(x)).join(', ');else if(q.type==='scale')a=`${a} / 100`;else a= a===undefined||a===null?'':(a==='Anderes'?dict().ui.other:trOption(a));if(q.type==='radio'&&answers[q.id]==='Anderes'&&answers[q.id+'_anderes'])a=dict().ui.otherPrefix+' '+answers[q.id+'_anderes'];let ex=q.extra&&answers[q.extra.id]?` (${esc(answers[q.extra.id])})`:'';return `<dt>${i+1}. ${esc(trQ(q.id))}</dt><dd>${esc(a)}${ex}</dd>`;}).join('');
  card.innerHTML=`<div class="result"><h2>${esc(dict().ui.thank)}</h2><p>${esc(dict().ui.answersIntro)}${questions.length}:</p><dl>${rows}</dl><p class="error" id="send-status" role="status" style="color:var(--muted)">${esc(dict().ui.sending)}</p><div class="nav"><button type="button" class="btn-secondary" id="download">${esc(dict().ui.download)}</button></div></div>`;
  document.getElementById('download').addEventListener('click',download);sendAnswers();
}
async function sendAnswers(){const s=document.getElementById('send-status');try{await window.saveAnswers(answers);s.style.color='var(--accent)';s.textContent=dict().ui.saved;}catch(err){console.error(err);s.style.color='var(--error)';s.textContent=dict().ui.failed;}}
function download(){const blob=new Blob([JSON.stringify(answers,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='umfrage-antworten.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
langSelect.addEventListener('change',()=>{currentLang=langSelect.value;try{localStorage.setItem("surveyLanguage",currentLang);}catch(_){}answers.umfrage_sprache=currentLang;updateUI();render();});
updateUI();render();
</script>
</body>
