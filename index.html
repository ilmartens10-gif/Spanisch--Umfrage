<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umfrage (Testversion)</title>
<style>
  :root {
    --bg: #eef2f5;
    --card: #ffffff;
    --ink: #1c2b33;
    --muted: #5d6f79;
    --line: #cfd9df;
    --accent: #0f6b6b;
    --accent-dark: #0a4f4f;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.55;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .counter { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: 8px 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 24px;
  }
  .section { font-family: system-ui, sans-serif; font-size: .9rem; color: var(--accent); margin: 0 0 6px; font-weight: 600; }
  .question { font-size: 1.25rem; margin: 0 0 18px; font-weight: normal; }
  .hint { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: -10px 0 14px; }

  .options { display: flex; flex-direction: column; gap: 8px; font-family: system-ui, sans-serif; }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .option:hover { border-color: var(--accent); }
  .option:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .option input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    font: 1rem system-ui, sans-serif;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .extra { margin-top: 14px; }
  .extra label { display: block; font-family: system-ui, sans-serif; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }

  :focus-visible { outline: 3px solid #7cc4c4; outline-offset: 2px; }

  .error { color: var(--error); font-family: system-ui, sans-serif; font-size: .9rem; margin: 12px 0 0; min-height: 1.3em; }

  .nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 12px; }
  button {
    font: 600 1rem system-ui, sans-serif;
    padding: 12px 22px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: transparent; color: var(--accent); }
  .btn-secondary:hover { background: #e6f2f2; }
  button:disabled { opacity: .4; cursor: default; }

  .result h2 { margin-top: 0; }
  .result dl { font-family: system-ui, sans-serif; margin: 0 0 20px; }
  .result dt { font-weight: 600; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .result dd { margin: 2px 0 0; }

  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
  textarea {
    width: 100%; padding: 12px 14px; font: 1rem system-ui, sans-serif; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; background: #fff; resize: vertical;
  }
  .scale .ends { display: flex; justify-content: space-between; gap: 12px; font: .85rem system-ui, sans-serif; color: var(--muted); margin-bottom: 8px; }
  .pts { display: flex; gap: 8px; }
  .pt { flex: 1; display: flex; justify-content: center; padding: 14px 0; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .pt:hover { border-color: var(--accent); }
  .pt:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .pt input { accent-color: var(--accent); width: 20px; height: 20px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Umfrage (Testversion)</h1>
  <p class="sub">Gekürzte Version zum Testen der Statistik</p>

  <div id="progress-wrap">
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="bar"></div></div>
    <p class="counter" id="counter"></p>
  </div>

  <section class="card" id="card" aria-live="polite"></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
window.saveAnswers = a => addDoc(collection(db, "responses"), { ...a, createdAt: serverTimestamp() });
</script>
<script>
// ---------- Fragen ----------
// type: text | number | radio | checkbox | select
// extra: optionales zusätzliches Textfeld (nicht verpflichtend)
const questions = [
  {"section": "Fragen zur Person", "id": "alter", "type": "number", "text": "Wie alt sind Sie?", "min": 1, "max": 120},
  {"section": "Fragen zur Person", "id": "geschlecht", "type": "radio", "text": "Kennzeichnen Sie Ihr Geschlecht:", "options": ["männlich", "weiblich", "divers"]},
  {"section": "Fragen zur Person", "id": "region", "type": "select", "text": "Ich wohne zurzeit in:", "options": ["Andalusien", "Aragonien", "Asturien", "Balearische Inseln", "Baskenland", "Valencia", "Galicien", "Kanarische Inseln", "Kantabrien", "Kastilien-La Mancha", "Kastilien und León", "Katalonien", "Madrid", "Murcia", "Navarra", "La Rioja", "Extremadura", "Ceuta", "Melilla"]},
  {"section": "Fragen zur Person", "id": "bleiben", "type": "radio", "text": "Haben Sie vor, in Spanien / einem spanischsprachigen Land ansässig zu werden?", "options": ["Definitiv", "Gut wahrscheinlich", "Eher nicht", "Auf gar keinen Fall", "Weiß ich noch nicht"]},
  {"section": "Fragen zum Sprachgebrauch im Alltag", "id": "muttersprache", "type": "checkbox", "text": "Welche Sprache/n empfinden Sie als Ihre Muttersprache?", "hint": "Mehr als eine Antwort möglich.", "options": ["Russisch", "Ukrainisch", "Weißrussisch"], "other": true},
  {"section": "Fragen zum Sprachgebrauch im Alltag", "id": "kastilisch_sprechen", "type": "radio", "text": "Sprechen Sie Kastilisch?", "options": ["Ja", "Nein"], "extra": {"id": "kastilisch_niveau", "label": "Mit dem Niveau (wenn kein offizielles Abzeichen vorhanden ist, dann geschätzt):"}},
  {"section": "Fragen zum Spracherwerb", "id": "fremdsprachen", "type": "textarea", "text": "Welche weiteren Fremdsprachen beherrschen Sie?", "hint": "Zählen Sie bitte auf, am besten mit dem Abzeichen. Falls keine, schreiben Sie „keine“."},
  {"section": "Fragen zum Spracherwerb", "id": "k_arbeit", "type": "scale", "text": "Wie sicher sprechen Sie Kastilisch bei der Arbeit?", "left": "sehr sicher", "right": "sehr unsicher"},
  {"section": "Fragen zum Spracherwerb", "id": "k_einkaufen", "type": "scale", "text": "Wie sicher sprechen Sie Kastilisch beim Einkaufen?", "left": "sehr sicher", "right": "sehr unsicher"},
  {"section": "Fragen zum Spracherwerb", "id": "k_lesen", "type": "radio", "text": "Lesen Sie eigenständig Literatur auf Kastilisch?", "options": ["ja, fast immer auf Kastilisch", "ja, ab und zu", "nur selten", "gar nicht"]},
  {"section": "Fragen zum Spracherwerb", "id": "r_lernen", "type": "radio", "text": "Lernen Sie die Regionalsprache Ihrer Autonomie?", "options": ["Ja", "Nein", "Meine Region hat keine eigene Regionalsprache"]},
  {"section": "Fragen zum Spracherwerb", "id": "r_arbeit", "type": "scale", "text": "Wie sicher sprechen Sie Ihre Regionalsprache bei der Arbeit?", "left": "sehr sicher", "right": "sehr unsicher", "hideIf": {"id": "r_lernen", "value": "Meine Region hat keine eigene Regionalsprache"}},
  {"section": "Fragen zum Spracherwerb", "id": "r_lesen", "type": "radio", "text": "Lesen Sie eigenständig Literatur in Ihrer Regionalsprache?", "options": ["ja, fast immer in meiner Regionalsprache", "ja, ab und zu", "nur selten", "gar nicht"], "hideIf": {"id": "r_lernen", "value": "Meine Region hat keine eigene Regionalsprache"}}
];

// ---------- Zustand ----------
const answers = {};
let current = 0;

// Fragen können je nach früherer Antwort übersprungen werden (hideIf)
const visible = i => { const h = questions[i].hideIf; return !h || answers[h.id] !== h.value; };
function step(from, dir) {
  let i = from + dir;
  while (i >= 0 && i < questions.length && !visible(i)) i += dir;
  return i;
}

const card = document.getElementById("card");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");
const progress = document.querySelector(".progress");

// ---------- Hilfsfunktionen ----------
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function optionHTML(type, name, value, checked) {
  return `<label class="option">
    <input type="${type}" name="${name}" value="${esc(value)}" ${checked ? "checked" : ""}>
    <span>${esc(value)}</span></label>`;
}

// ---------- Rendern ----------
function render() {
  const q = questions[current];
  const saved = answers[q.id];
  let input = "";

  if (q.type === "text") {
    input = `<input type="text" id="field" autocomplete="off" value="${esc(saved || "")}">`;
  } else if (q.type === "number") {
    input = `<input type="number" id="field" inputmode="numeric" min="${q.min}" max="${q.max}" value="${esc(saved || "")}">`;
  } else if (q.type === "select") {
    input = `<select id="field"><option value="">Bitte auswählen …</option>` +
      q.options.map(o => `<option ${saved === o ? "selected" : ""}>${esc(o)}</option>`).join("") +
      `</select>`;
  } else if (q.type === "radio") {
    const otherText = answers[q.id + "_anderes"] || "";
    input = `<div class="options">` +
      q.options.map(o => optionHTML("radio", q.id, o, saved === o)).join("") +
      (q.other ? optionHTML("radio", q.id, "Anderes", saved === "Anderes") : "") + `</div>` +
      (q.other ? `<div class="extra"><input type="text" id="other-text" placeholder="Bitte angeben" value="${esc(otherText)}" aria-label="Andere Antwort"></div>` : "");
  } else if (q.type === "textarea") {
    input = `<textarea id="field" rows="4">${esc(saved || "")}</textarea>`;
  } else if (q.type === "scale") {
    input = `<div class="scale"><div class="ends"><span>${esc(q.left)}</span><span>${esc(q.right)}</span></div>
      <div class="pts" role="radiogroup" aria-label="${esc(q.text)}">` +
      [6, 5, 4, 3, 2, 1].map(v => `<label class="pt"><input type="radio" name="${q.id}" value="${v}" ${Number(saved) === v ? "checked" : ""} aria-label="Stufe ${7 - v} von 6"></label>`).join("") +
      `</div></div>`;
  } else if (q.type === "checkbox") {
    const list = saved || [];
    const otherText = (answers[q.id + "_anderes"] || "");
    input = `<div class="options">` +
      q.options.map(o => optionHTML("checkbox", q.id, o, list.includes(o))).join("") +
      (q.other ? `<label class="option">
          <input type="checkbox" id="other-check" ${otherText ? "checked" : ""}>
          <span>Anderes:</span></label>` : "") +
      `</div>` +
      (q.other ? `<div class="extra"><input type="text" id="other-text" placeholder="Bitte angeben" value="${esc(otherText)}" aria-label="Andere Sprache"></div>` : "");
  }

  const extra = q.extra ? `<div class="extra">
      <label for="extra-field">${esc(q.extra.label)}</label>
      <input type="text" id="extra-field" value="${esc(answers[q.extra.id] || "")}"></div>` : "";

  const isLast = step(current, 1) >= questions.length;

  card.innerHTML = `
    <p class="section">${esc(q.section)}</p>
    <h2 class="question">${current + 1}. ${esc(q.text)}</h2>
    ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ""}
    ${input}
    ${extra}
    <p class="error" id="error" role="alert"></p>
    <div class="nav">
      <button type="button" class="btn-secondary" id="back" ${step(current, -1) < 0 ? "disabled" : ""}>Zurück</button>
      <button type="button" class="btn-primary" id="next">${isLast ? "Abschließen" : "Weiter"}</button>
    </div>`;

  // Fortschritt
  const pct = (current / questions.length) * 100;
  bar.style.width = pct + "%";
  progress.setAttribute("aria-valuenow", Math.round(pct));
  counter.textContent = `Frage ${current + 1} von ${questions.length}`;

  document.getElementById("back").addEventListener("click", goBack);
  document.getElementById("next").addEventListener("click", goNext);

  // Enter-Taste bei Einzeilen-Feldern
  const field = document.getElementById("field");
  if (field && field.tagName === "INPUT") {
    field.addEventListener("keydown", e => { if (e.key === "Enter") goNext(); });
    field.focus();
  }

  // "Anderes" automatisch ankreuzen, sobald getippt wird
  const ot = document.getElementById("other-text");
  if (ot) {
    ot.addEventListener("input", () => {
      const oc = document.getElementById("other-check");
      if (oc) oc.checked = ot.value.trim() !== "";
      else if (ot.value.trim()) {
        const r = card.querySelector(`input[name="${q.id}"][value="Anderes"]`);
        if (r) r.checked = true;
      }
    });
  }
}

// ---------- Antwort lesen + prüfen ----------
function collect(q) {
  if (q.type === "radio" || q.type === "scale") {
    const c = card.querySelector(`input[name="${q.id}"]:checked`);
    return c ? c.value : "";
  }
  if (q.type === "checkbox") {
    const list = [...card.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i => i.value);
    const oc = document.getElementById("other-check");
    const ot = document.getElementById("other-text");
    if (oc && oc.checked && ot.value.trim()) list.push("Anderes: " + ot.value.trim());
    return list;
  }
  return document.getElementById("field").value.trim();
}

function validate(q, value) {
  if (q.type === "checkbox") {
    const oc = document.getElementById("other-check");
    const ot = document.getElementById("other-text");
    if (oc && oc.checked && !ot.value.trim()) return "Bitte geben Sie bei „Anderes“ eine Sprache an.";
    if (!value.length) return "Bitte wählen Sie mindestens eine Antwort aus.";
    if (q.exclusive && value.includes(q.exclusive) && value.length > 1)
      return `„${q.exclusive}“ kann nicht mit anderen Antworten kombiniert werden.`;
    return "";
  }
  if (!value) return q.type === "radio" || q.type === "select" || q.type === "scale"
    ? "Bitte wählen Sie eine Antwort aus." : "Bitte beantworten Sie diese Frage.";
  if (q.type === "radio" && q.other && value === "Anderes" && !document.getElementById("other-text").value.trim())
    return "Bitte geben Sie bei „Anderes“ eine Antwort an.";
  if (q.type === "number") {
    const n = Number(value);
    if (!Number.isInteger(n) || n < q.min || n > q.max)
      return `Bitte geben Sie eine ganze Zahl zwischen ${q.min} und ${q.max} ein.`;
  }
  return "";
}

function save(q, value) {
  answers[q.id] = (q.type === "number" || q.type === "scale") ? Number(value) : value;
  if (q.extra) answers[q.extra.id] = document.getElementById("extra-field").value.trim();
  if (q.other) {
    const ot = document.getElementById("other-text");
    answers[q.id + "_anderes"] = (q.type === "radio" && value !== "Anderes") ? "" : ot.value.trim();
  }
}

// ---------- Navigation ----------
function goNext() {
  const q = questions[current];
  const value = collect(q);
  const err = validate(q, value);
  if (err) { document.getElementById("error").textContent = err; return; }
  save(q, value);
  const n = step(current, 1);
  if (n >= questions.length) return showResult();
  current = n;
  render();
}

function goBack() {
  const q = questions[current];
  // Eingaben beim Zurückgehen behalten (ohne Pflichtprüfung)
  const value = collect(q);
  if (value && value.length !== 0) save(q, value);
  current = Math.max(step(current, -1), 0);
  render();
}

// ---------- Ergebnis ----------
function showResult() {
  // Antworten übersprungener Fragen verwerfen
  questions.forEach((q, i) => {
    if (!visible(i)) {
      delete answers[q.id]; delete answers[q.id + "_anderes"];
      if (q.extra) delete answers[q.extra.id];
    }
  });
  bar.style.width = "100%";
  progress.setAttribute("aria-valuenow", 100);
  counter.textContent = "Fertig";

  const rows = questions.map((q, i) => {
    if (!visible(i)) return "";
    let a = answers[q.id];
    if (Array.isArray(a)) a = a.join(", ");
    if (q.type === "scale") a = a + " von 6";
    if (q.type === "radio" && a === "Anderes" && answers[q.id + "_anderes"]) a = "Anderes: " + answers[q.id + "_anderes"];
    let extra = "";
    if (q.extra && answers[q.extra.id]) extra = ` (${esc(answers[q.extra.id])})`;
    return `<dt>${i + 1}. ${esc(q.text)}</dt><dd>${esc(a)}${extra}</dd>`;
  }).join("");

  card.innerHTML = `<div class="result">
    <h2>Vielen Dank!</h2>
    <p>Das sind Ihre Antworten zu den Fragen 1 bis ${questions.length}:</p>
    <dl>${rows}</dl>
    <p class="error" id="send-status" role="status" style="color:var(--muted)">Ihre Antworten werden gesendet …</p>
    <div class="nav">
      <button type="button" class="btn-secondary" id="download">Kopie als Datei speichern</button>
    </div></div>`;

  document.getElementById("download").addEventListener("click", download);
  sendAnswers();
}

async function sendAnswers() {
  const s = document.getElementById("send-status");
  try {
    await window.saveAnswers(answers);
    s.style.color = "var(--accent)";
    s.textContent = "Ihre Antworten wurden gespeichert. Vielen Dank für Ihre Teilnahme!";
  } catch (err) {
    console.error(err);
    s.style.color = "var(--error)";
    s.textContent = "Das Senden hat nicht geklappt. Bitte speichern Sie eine Kopie als Datei und schicken Sie sie uns.";
  }
}

function download() {
  const blob = new Blob([JSON.stringify(answers, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "umfrage-antworten.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

render();
</script>
</body>
</html>
