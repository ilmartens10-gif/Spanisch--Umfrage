<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос</title>
<style>
  :root {
    --bg: #eef2f5;
    --card: #ffffff;
    --ink: #1c2b33;
    --muted: #5d6f79;
    --line: #cfd9df;
    --accent: #0f6b6b;
    --accent-dark: #0a4f4f;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.55;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .counter { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: 8px 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 24px;
  }
  .section { font-family: system-ui, sans-serif; font-size: .9rem; color: var(--accent); margin: 0 0 6px; font-weight: 600; }
  .question { font-size: 1.25rem; margin: 0 0 18px; font-weight: normal; }
  .hint { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: -10px 0 14px; }

  .options { display: flex; flex-direction: column; gap: 8px; font-family: system-ui, sans-serif; }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .option:hover { border-color: var(--accent); }
  .option:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .option input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    font: 1rem system-ui, sans-serif;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .extra { margin-top: 14px; }
  .extra label { display: block; font-family: system-ui, sans-serif; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }

  :focus-visible { outline: 3px solid #7cc4c4; outline-offset: 2px; }

  .error { color: var(--error); font-family: system-ui, sans-serif; font-size: .9rem; margin: 12px 0 0; min-height: 1.3em; }

  .nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 12px; }
  button {
    font: 600 1rem system-ui, sans-serif;
    padding: 12px 22px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: transparent; color: var(--accent); }
  .btn-secondary:hover { background: #e6f2f2; }
  button:disabled { opacity: .4; cursor: default; }

  .result h2 { margin-top: 0; }
  .result dl { font-family: system-ui, sans-serif; margin: 0 0 20px; }
  .result dt { font-weight: 600; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .result dd { margin: 2px 0 0; }

  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
  textarea {
    width: 100%; padding: 12px 14px; font: 1rem system-ui, sans-serif; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; background: #fff; resize: vertical;
  }
  .scale .ends { display: flex; justify-content: space-between; gap: 12px; font: .85rem system-ui, sans-serif; color: var(--muted); margin-bottom: 8px; }
  .pts { display: flex; gap: 8px; }
  .pt { flex: 1; display: flex; justify-content: center; padding: 14px 0; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .pt:hover { border-color: var(--accent); }
  .pt:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .pt input { accent-color: var(--accent); width: 20px; height: 20px; margin: 0; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .top select { width: auto; padding: 8px 10px; font: .9rem system-ui, sans-serif; }
  .sr { position: absolute; left: -9999px; }
  .sl { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .sl input[type=range] { flex: 1; height: 32px; margin: 0; accent-color: var(--accent); }
  .sl input.untouched { accent-color: #9aa8b0; }
  .sl output { min-width: 3ch; text-align: right; font: 600 1.4rem system-ui, sans-serif; }

  .langbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .lbtn { background: transparent; color: var(--accent); }
  .lbtn.on { background: var(--accent); color: #fff; }
  .types { padding-left: 20px; } .types li { margin: 8px 0; }
  .card h3 { font-size: 1.05rem; margin: 22px 0 6px; }
  .card p { margin: 10px 0; }
  .note { color: var(--muted); font: .9rem system-ui, sans-serif; }
  .skiphint { font: .8rem system-ui, sans-serif; color: var(--muted); margin: 14px 0 0; }
</style>

</main>

window.saveAnswers = a => addDoc(collection(db, "responses"), { ...a, createdAt: serverTimestamp() });

function pickLang() {
  const map = { ru: "ru", uk: "uk", ua: "uk", be: "be", by: "be" };
  const p = new URLSearchParams(location.search).get("lang");
  const cand = [p, ...(navigator.languages || [navigator.language])].filter(Boolean).map(x => map[x.toLowerCase().slice(0, 2)]);

  const q = SPEC[i];
  if ((q.hideIf || []).some(c => c.in.includes(answers[c.id]))) return false;
  return !(q.hideIfNot || []).some(c => answers[c.id] !== undefined && !c.in.includes(answers[c.id]));
}
function step(from, dir) {
  let i = from + dir;
  while (i >= 0 && i < SPEC.length && !visible(i)) i += dir;
  return i;

}

function optionHTML(type, name, value, label, checked) {
  return `<label class="option"><input type="${type}" name="${name}" value="${esc(value)}" ${checked ? "checked" : ""}><span>${esc(label)}</span></label>`;
}

function render() { stage === "intro" ? renderIntro() : renderQuestion(); }

function renderIntro() {
  const p = TR[lang].pre;
  progressWrap.hidden = true;
  card.innerHTML = `
    <div class="langbtns" role="group" aria-label="${esc(t("lang"))}">${LANGS.map(c =>
      `<button type="button" class="lbtn ${c === lang ? "on" : ""}" data-l="${c}" lang="${c}">${esc(TR[c].ui.name)}</button>`).join("")}</div>
    <h2 class="question">${esc(p.title)}</h2>
    <p><strong>${esc(p.hello)}</strong></p>
    <p>${esc(p.p1)}</p>
    <p>${esc(p.intro)}</p>
    <ul class="types">${p.types.map(([a, b]) => `<li><strong>${esc(a)}:</strong> ${esc(b)}</li>`).join("")}</ul>
    <p>${esc(p.skip)}</p>
    <h3>${esc(p.privh)}</h3>
    <p>${esc(p.priv1)}</p>
    <p>${esc(p.priv2)}</p>
    <p>${esc(p.thanks)}</p>
    <p class="note">${esc(p.note)}</p>
    <div class="nav"><span></span><button type="button" class="btn-primary" id="start">${esc(t("start"))}</button></div>`;
  card.querySelectorAll(".lbtn").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
  document.getElementById("start").addEventListener("click", () => {
    stage = "q"; current = Math.max(step(-1, 1), 0); render(); window.scrollTo(0, 0);
  });
}

function renderQuestion() {
  const q = SPEC[current], X = QX(q), saved = answers[q.id];
  progressWrap.hidden = false;
  let input = "";
  const otherText = answers[q.id + "_anderes"] || "";
  const otherField = q.other ? `<div class="extra"><input type="text" id="other-text" placeholder="${esc(t("otherPh"))}" value="${esc(otherText)}" aria-label="${esc(X.ot)}"></div>` : "";

  if (q.type === "text") {
    input = `<input type="text" id="field" autocomplete="off" value="${esc(saved || "")}">`;
  } else if (q.type === "number") {
    input = `<input type="number" id="field" inputmode="numeric" min="${q.min}" max="${q.max}" value="${esc(saved || "")}">`;
  } else if (q.type === "textarea") {
    input = `<textarea id="field" rows="4">${esc(saved || "")}</textarea>`;
  } else if (q.type === "select") {
    input = `<select id="field"><option value="">${esc(t("choose"))}</option>` +
      q.o.map((o, i) => `<option value="${esc(o)}" ${saved === o ? "selected" : ""}>${esc(X.o[i])}</option>`).join("") + `</select>`;
  } else if (q.type === "radio") {
    input = `<div class="options">` + q.o.map((o, i) => optionHTML("radio", q.id, o, X.o[i], saved === o)).join("") +
      (q.other ? optionHTML("radio", q.id, "Anderes", X.ot + ":", saved === "Anderes") : "") + `</div>` + otherField;
  } else if (q.type === "checkbox") {
    const list = saved || [];
    input = `<div class="options">` + q.o.map((o, i) => optionHTML("checkbox", q.id, o, X.o[i], list.includes(o))).join("") +
      (q.other ? `<label class="option"><input type="checkbox" id="other-check" ${otherText ? "checked" : ""}><span>${esc(X.ot)}:</span></label>` : "") +
      `</div>` + otherField;
  } else if (q.type === "scale") {
    const sv = Number(saved) || 0;
    input = `<div class="scale"><div class="ends"><span>${esc(X.lo)}</span><span>${esc(X.hi)}</span></div>
      <div class="sl"><input type="range" id="slider" min="1" max="100" step="1" value="${sv || 50}" data-touched="${sv ? 1 : 0}"
        class="${sv ? "" : "untouched"}" aria-label="${esc(X.t)}"><output id="sval" for="slider">${sv || "–"}</output></div></div>`;
  }
  const extra = q.extra ? `<div class="extra"><label for="extra-field">${esc(X.x)}</label>
      <input type="text" id="extra-field" value="${esc(answers[q.extra] || "")}"></div>` : "";
  const isLast = step(current, 1) >= SPEC.length;

  card.innerHTML = `
    <p class="section">${esc(TR[lang].sec[q.n <= 10 ? 0 : 1])}</p>
    <h2 class="question">${q.n}. ${esc(X.t)}</h2>
    ${X.h ? `<p class="hint">${esc(X.h)}</p>` : ""}
    ${input}
    ${extra}
    <p class="error" id="error" role="alert"></p>
    <p class="skiphint">${esc(t("skipHint"))}</p>
    <div class="nav">
      <button type="button" class="btn-secondary" id="back">${esc(t("back"))}</button>
      <button type="button" class="btn-primary" id="next">${esc(isLast ? t("finish") : t("next"))}</button>
    </div>`;

  const pct = (current / SPEC.length) * 100;
  bar.style.width = pct + "%";
  progress.setAttribute("aria-valuenow", Math.round(pct));
  counter.textContent = t("counter", { n: q.n, m: SPEC.length });

  document.getElementById("back").addEventListener("click", goBack);
  document.getElementById("next").addEventListener("click", goNext);
  const field = document.getElementById("field");
  if (field && field.tagName === "INPUT") field.addEventListener("keydown", e => { if (e.key === "Enter") goNext(); });
  const sl = document.getElementById("slider");
  if (sl) {
    const touch = () => { sl.dataset.touched = "1"; sl.classList.remove("untouched"); document.getElementById("sval").textContent = sl.value; };
    ["input", "pointerdown"].forEach(ev => sl.addEventListener(ev, touch));
  }
  const ot = document.getElementById("other-text");
  if (ot) ot.addEventListener("input", () => {
    const oc = document.getElementById("other-check");
    if (oc) oc.checked = ot.value.trim() !== "";
    else if (ot.value.trim()) { const r = card.querySelector(`input[name="${q.id}"][value="Anderes"]`); if (r) r.checked = true; }
  });
}

// ---------- Antwort lesen, prüfen, speichern (jede Frage darf übersprungen werden) ----------
function collect(q) {
  if (q.type === "radio") { const c = card.querySelector(`input[name="${q.id}"]:checked`); return c ? c.value : ""; }
  if (q.type === "scale") { const s = document.getElementById("slider"); return s && s.dataset.touched === "1" ? s.value : ""; }
  if (q.type === "checkbox") {
    const list = [...card.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i => i.value);
    const oc = document.getElementById("other-check"), ot = document.getElementById("other-text");
    if (oc && oc.checked && ot.value.trim()) list.push("Anderes: " + ot.value.trim());
    return list;
  }
  return document.getElementById("field").value.trim();
}

function validate(q, value) {
  const X = QX(q), ot = document.getElementById("other-text");
  if (q.type === "checkbox") {
    const oc = document.getElementById("other-check");
    if (oc && oc.checked && !ot.value.trim()) return t("errOther", { o: X.ot });
    return "";
  }
  if (q.type === "radio" && q.other && value === "Anderes" && !ot.value.trim()) return t("errOther", { o: X.ot });
  if (q.type === "number" && value !== "") {
    const n = Number(value);
    if (!Number.isInteger(n) || n < q.min || n > q.max) return t("errNum", { a: q.min, b: q.max });
  }
  return "";
}

function save(q, value) {
  const empty = value === "" || (Array.isArray(value) && !value.length);
  if (empty) delete answers[q.id]; else answers[q.id] = (q.type === "number" || q.type === "scale") ? Number(value) : value;
  if (q.extra) { const v = document.getElementById("extra-field").value.trim(); v ? answers[q.extra] = v : delete answers[q.extra]; }
  if (q.other) {
    const v = document.getElementById("other-text").value.trim();
    const use = q.type === "radio" ? value === "Anderes" : true;
    v && use ? answers[q.id + "_anderes"] = v : delete answers[q.id + "_anderes"];
  }
}

function goNext() {
  const q = SPEC[current], value = collect(q), err = validate(q, value);
  if (err) { document.getElementById("error").textContent = err; return; }
  save(q, value);
  const n = step(current, 1);
  if (n >= SPEC.length) return showResult();
  current = n; render(); window.scrollTo(0, 0);
}

function goBack() {
  const q = SPEC[current];
  try { save(q, collect(q)); } catch (_) {}
  const n = step(current, -1);
  if (n < 0) stage = "intro"; else current = n;
  render(); window.scrollTo(0, 0);
}

function setLang(l) {
  if (stage === "q") { try { const q = SPEC[current]; save(q, collect(q)); } catch (_) {} }
  lang = l; applyStatic(); render();
}
sel.addEventListener("change", e => setLang(e.target.value));

// ---------- Ergebnis ----------
function fmt(q, a) {
  const X = QX(q);
  if (q.type === "scale") return a + " / 100";
  const lab = v => v === "Anderes" ? X.ot : (q.o && q.o.includes(v) ? X.o[q.o.indexOf(v)] : v);
  if (Array.isArray(a)) return a.map(v => v.startsWith("Anderes: ") ? X.ot + ": " + v.slice(9) : lab(v)).join(", ");
  if (a === "Anderes" && answers[q.id + "_anderes"]) return X.ot + ": " + answers[q.id + "_anderes"];
  return lab(a);
}

function showResult() {
  stage = "done";
  sel.disabled = true;
  // Antworten von Fragen, die nicht (mehr) angezeigt werden, verwerfen
  const vis = SPEC.map((q, i) => visible(i));
  SPEC.forEach((q, i) => { if (!vis[i]) { delete answers[q.id]; delete answers[q.id + "_anderes"]; if (q.extra) delete answers[q.extra]; } });
  answers.sprache = lang;
  answers.uebersprungen = SPEC.filter((q, i) => vis[i] && !hasAnswer(q)).map(q => q.id);

  bar.style.width = "100%"; progress.setAttribute("aria-valuenow", 100); counter.textContent = "";
  const rows = SPEC.map((q, i) => {
    if (!vis[i]) return "";
    const extra = q.extra && answers[q.extra] ? ` (${esc(answers[q.extra])})` : "";
    return `<dt>${q.n}. ${esc(QX(q).t)}</dt><dd>${hasAnswer(q) ? esc(fmt(q, answers[q.id])) + extra : `<em>${esc(t("skipped"))}</em>`}</dd>`;
  }).join("");
  card.innerHTML = `<div class="result"><h2>${esc(t("thanks"))}</h2><p>${esc(t("summary"))}</p><dl>${rows}</dl>
    <p class="error" id="send-status" role="status" style="color:var(--muted)">${esc(t("sending"))}</p>
    <div class="nav"><button type="button" class="btn-secondary" id="download">${esc(t("download"))}</button></div></div>`;
  document.getElementById("download").addEventListener("click", download);
  window.scrollTo(0, 0);
  sendAnswers();
}

async function sendAnswers() {
  const s = document.getElementById("send-status");
  try { await window.saveAnswers(answers); s.style.color = "var(--accent)"; s.textContent = t("sent"); }
  catch (err) { console.error(err); s.style.color = "var(--error)"; s.textContent = t("failed"); }
}

function download() {
  const blob = new Blob([JSON.stringify(answers, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "umfrage-antworten.json"; a.click(); URL.revokeObjectURL(a.href);
}

// ---------- Start ----------
sel.innerHTML = LANGS.map(c => `<option value="${c}">${esc(TR[c].ui.name)}</option>`).join("");
applyStatic();
render();
</script>
</body>
</html>
