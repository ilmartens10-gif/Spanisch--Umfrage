<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umfrage</title>
<style>
  :root {
    --bg: #ebf3fa;
    --card: #ffffff;
    --ink: #1c2b33;
    --muted: #5d6f79;
    --line: #cfd9df;
    --accent: #0f6b6b;
    --accent-dark: #0a4f4f;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.55;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .counter { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: 8px 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 24px;
  }
  .section { font-family: system-ui, sans-serif; font-size: .9rem; color: var(--accent); margin: 0 0 6px; font-weight: 600; }
  .question { font-size: 1.25rem; margin: 0 0 18px; font-weight: normal; }
  .hint { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin: -10px 0 14px; }

  .options { display: flex; flex-direction: column; gap: 8px; font-family: system-ui, sans-serif; }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .option:hover { border-color: var(--accent); }
  .option:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .option input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    font: 1rem system-ui, sans-serif;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .extra { margin-top: 14px; }
  .extra label { display: block; font-family: system-ui, sans-serif; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }

  :focus-visible { outline: 3px solid #7cc4c4; outline-offset: 2px; }

  .error { color: var(--error); font-family: system-ui, sans-serif; font-size: .9rem; margin: 12px 0 0; min-height: 1.3em; }

  .nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 12px; }
  button {
    font: 600 1rem system-ui, sans-serif;
    padding: 12px 22px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: transparent; color: var(--accent); }
  .btn-secondary:hover { background: #e6f2f2; }
  button:disabled { opacity: .4; cursor: default; }

  .result h2 { margin-top: 0; }
  .result dl { font-family: system-ui, sans-serif; margin: 0 0 20px; }
  .result dt { font-weight: 600; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .result dd { margin: 2px 0 0; }

  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
  textarea {
    width: 100%; padding: 12px 14px; font: 1rem system-ui, sans-serif; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; background: #fff; resize: vertical;
  }
  .scale .ends { display: flex; justify-content: space-between; gap: 12px; font: .85rem system-ui, sans-serif; color: var(--muted); margin-bottom: 8px; }
  .pts { display: flex; gap: 8px; }
  .pt { flex: 1; display: flex; justify-content: center; padding: 14px 0; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .pt:hover { border-color: var(--accent); }
  .pt:has(input:checked) { border-color: var(--accent); background: #e6f2f2; }
  .pt input { accent-color: var(--accent); width: 20px; height: 20px; margin: 0; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .top select { width: auto; padding: 8px 10px; font: .9rem system-ui, sans-serif; }
  .sr { position: absolute; left: -9999px; }
  .sl { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .sl input[type=range] { flex: 1; height: 32px; margin: 0; accent-color: var(--accent); }
  .sl input.untouched { accent-color: #9aa8b0; }
  .sl output { min-width: 3ch; text-align: right; font: 600 1.4rem system-ui, sans-serif; }
</style>

</head>

    <p class="counter" id="counter"></p>
  </div>

  <section class="card" id="card" aria-live="polite"></section>
</main>

const db = getFirestore(initializeApp(firebaseConfig));
window.saveAnswers = a => addDoc(collection(db, "responses"), { ...a, createdAt: serverTimestamp() });

  {"section": "Fragen zum Spracherwerb", "id": "r_podcasts", "type": "radio", "text": "Hören Sie Podcasts in Ihrer Regionalsprache?", "options": ["ja, fast immer in meiner Regionalsprache", "ja, ab und zu", "nur selten", "gar nicht"], "hideIf": [{"id": "region", "in": ["Andalusien", "Kanarische Inseln", "Kantabrien", "Kastilien-La Mancha", "Madrid", "Murcia", "La Rioja", "Extremadura", "Ceuta", "Melilla"]}, {"id": "r_lernen", "in": ["Meine Region hat keine eigene Regionalsprache"]}]},
  {"section": "Fragen zum Spracherwerb", "id": "r_audio", "type": "scale", "text": "Wie gut nehmen Sie akustisch audio- und audiovisuelle Medien in Ihrer Regionalsprache wahr?", "left": "sehr sicher", "right": "verstehe gar nichts", "hideIf": [{"id": "region", "in": ["Andalusien", "Kanarische Inseln", "Kantabrien", "Kastilien-La Mancha", "Madrid", "Murcia", "La Rioja", "Extremadura", "Ceuta", "Melilla"]}, {"id": "r_lernen", "in": ["Meine Region hat keine eigene Regionalsprache"]}]},
  {"section": "Fragen zum Spracherwerb", "id": "r_leben", "type": "scale", "text": "Wie gut nehmen Sie akustisch Menschen in Ihrer Regionalsprache im echten Leben wahr?", "left": "sehr sicher", "right": "verstehe gar nichts", "hideIf": [{"id": "region", "in": ["Andalusien", "Kanarische Inseln", "Kantabrien", "Kastilien-La Mancha", "Madrid", "Murcia", "La Rioja", "Extremadura", "Ceuta", "Melilla"]}, {"id": "r_lernen", "in": ["Meine Region hat keine eigene Regionalsprache"]}]},
  {"section": "Fragen zum Spracherwerb", "id": "r_influencer", "type": "radio", "text": "Folgen Sie Influencern/Kanälen in Ihrer Regionalsprache in den öffentlichen Medien?", "hint": "YouTube, Instagram etc.", "options": ["Ja, vielen", "Ja, einigen", "Nein, (fast) keinen"], "hideIf": [{"id": "region", "in": ["Andalusien", "Kanarische Inseln", "Kantabrien", "Kastilien-La Mancha", "Madrid", "Murcia", "La Rioja", "Extremadura", "Ceuta", "Melilla"]}, {"id": "r_lernen", "in": ["Meine Region hat keine eigene Regionalsprache"]}]}
];

const answers = {};
let current = 0;
let done = false;
let lang = pickLang();

const card = document.getElementById("card");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");
const progress = document.querySelector(".progress");

// ---------- Sprache ----------
function pickLang() {
  const p = new URLSearchParams(location.search).get("lang");
  const cand = [p, ...(navigator.languages || [navigator.language])].filter(Boolean).map(x => x.toLowerCase().slice(0, 2));
  return cand.find(c => TR[c]) || "de";
}
const t = (k, v) => {
  let s = (TR[lang].ui || {})[k] ?? UI_DE[k];
  for (const x in (v || {})) s = s.replace("{" + x + "}", v[x]);
  return s;
};
const opt = v => v === "Anderes" ? t("other") : (lang === "de" ? v : ((TR[lang].o || {})[v] || v));
const secText = q => lang === "de" ? q.section : ((TR[lang].sec || [])[SEC_DE.indexOf(q.section)] || q.section);
const extraLabel = q => lang === "de" ? q.extra.label : ((TR[lang].x || {})[q.extra.id] || q.extra.label);

function qText(q) {
  if (lang === "de") return q.text;
  const T = TR[lang], m = q.id.match(/^([kr])_(\w+)$/);
  if (m) {
    const pi = m[1] === "k" ? 0 : 1, key = m[2], ix = SPEAK.indexOf(key);
    if (ix >= 0) return T.p.speak.replace("{L}", T.L[pi]).replace("{c}", (pi === 0 && ix === 4) ? T.ctxK4 : T.ctx[ix]);
    if (T.p[key]) return T.p[key].replace(/\{L\}/g, T.L[pi]);
  }
  if (q.id === "kastilisch_gelernt") return T.p.gelernt.replace(/\{L\}/g, T.L[0]);
  return T.q[q.id] || q.text;
}
function qHint(q) {
  const key = q.id === "selbstbild" ? "selbstbild" : q.id === "fremdsprachen" ? "fremdsprachen"
    : /influencer$/.test(q.id) ? "social" : q.type === "checkbox" ? "multi" : null;
  if (!key) return "";
  return lang === "de" ? (q.hint || "") : ((TR[lang].h || {})[key] || q.hint || "");
}

// ---------- Bedingungen ----------
function visible(i) {
  const q = questions[i];
  if ((q.hideIf || []).some(c => c.in.includes(answers[c.id]))) return false;
  return (q.showIf || []).every(c => c.in.includes(answers[c.id]));
}
function step(from, dir) {
  let i = from + dir;
  while (i >= 0 && i < questions.length && !visible(i)) i += dir;
  return i;
}

// ---------- Hilfsfunktionen ----------
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function optionHTML(type, name, value, checked) {
  return `<label class="option">
    <input type="${type}" name="${name}" value="${esc(value)}" ${checked ? "checked" : ""}>
    <span>${esc(opt(value))}</span></label>`;
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.getElementById("h1").textContent = t("title");
  document.getElementById("sub").textContent = t("sub");
  document.getElementById("lang-lbl").textContent = t("lang");
  document.getElementById("lang").value = lang;
}

// ---------- Rendern ----------
function render() {
  const q = questions[current];
  const saved = answers[q.id];
  let input = "";

  if (q.type === "text") {
    input = `<input type="text" id="field" autocomplete="off" value="${esc(saved || "")}">`;
  } else if (q.type === "number") {
    input = `<input type="number" id="field" inputmode="numeric" min="${q.min}" max="${q.max}" value="${esc(saved || "")}">`;
  } else if (q.type === "select") {
    input = `<select id="field"><option value="">${esc(t("choose"))}</option>` +
      q.options.map(o => `<option value="${esc(o)}" ${saved === o ? "selected" : ""}>${esc(opt(o))}</option>`).join("") + `</select>`;
  } else if (q.type === "radio") {
    const otherText = answers[q.id + "_anderes"] || "";
    input = `<div class="options">` +
      q.options.map(o => optionHTML("radio", q.id, o, saved === o)).join("") +
      (q.other ? optionHTML("radio", q.id, "Anderes", saved === "Anderes") : "") + `</div>` +
      (q.other ? `<div class="extra"><input type="text" id="other-text" placeholder="${esc(t("otherPh"))}" value="${esc(otherText)}" aria-label="${esc(t("other"))}"></div>` : "");
  } else if (q.type === "textarea") {
    input = `<textarea id="field" rows="4">${esc(saved || "")}</textarea>`;
  } else if (q.type === "scale") {
    const sv = Number(saved) || 0;
    const lo = q.right === "verstehe gar nichts" ? t("lowUnder") : t("lowSpeak");
    input = `<div class="scale"><div class="ends"><span>${esc(lo)}</span><span>${esc(t("high"))}</span></div>
      <div class="sl"><input type="range" id="slider" min="1" max="100" step="1" value="${sv || 50}" data-touched="${sv ? 1 : 0}"
        class="${sv ? "" : "untouched"}" aria-label="${esc(qText(q))}"><output id="sval" for="slider">${sv || esc(t("unset"))}</output></div></div>`;
  } else if (q.type === "checkbox") {
    const list = saved || [];
    const otherText = answers[q.id + "_anderes"] || "";
    input = `<div class="options">` +
      q.options.map(o => optionHTML("checkbox", q.id, o, list.includes(o))).join("") +
      (q.other ? `<label class="option"><input type="checkbox" id="other-check" ${otherText ? "checked" : ""}><span>${esc(t("other"))}:</span></label>` : "") +
      `</div>` +
      (q.other ? `<div class="extra"><input type="text" id="other-text" placeholder="${esc(t("otherPh"))}" value="${esc(otherText)}" aria-label="${esc(t("other"))}"></div>` : "");
  }

  const extra = q.extra ? `<div class="extra">
      <label for="extra-field">${esc(extraLabel(q))}</label>
      <input type="text" id="extra-field" value="${esc(answers[q.extra.id] || "")}"></div>` : "";
  const hint = qHint(q);
  const isLast = step(current, 1) >= questions.length;

  card.innerHTML = `
    <p class="section">${esc(secText(q))}</p>
    <h2 class="question">${current + 1}. ${esc(qText(q))}</h2>
    ${hint ? `<p class="hint">${esc(hint)}</p>` : ""}
    ${input}
    ${extra}
    <p class="error" id="error" role="alert"></p>
    <div class="nav">
      <button type="button" class="btn-secondary" id="back" ${step(current, -1) < 0 ? "disabled" : ""}>${esc(t("back"))}</button>
      <button type="button" class="btn-primary" id="next">${esc(isLast ? t("finish") : t("next"))}</button>
    </div>`;

  const pct = (current / questions.length) * 100;
  bar.style.width = pct + "%";
  progress.setAttribute("aria-valuenow", Math.round(pct));
  counter.textContent = t("counter", { n: current + 1, m: questions.length });

  document.getElementById("back").addEventListener("click", goBack);
  document.getElementById("next").addEventListener("click", goNext);

  const field = document.getElementById("field");
  if (field && field.tagName === "INPUT") {
    field.addEventListener("keydown", e => { if (e.key === "Enter") goNext(); });
    field.focus();
  }
  const sl = document.getElementById("slider");
  if (sl) {
    const touch = () => {
      sl.dataset.touched = "1"; sl.classList.remove("untouched");
      document.getElementById("sval").textContent = sl.value;
    };
    ["input", "pointerdown"].forEach(ev => sl.addEventListener(ev, touch));
  }
  const ot = document.getElementById("other-text");
  if (ot) {
    ot.addEventListener("input", () => {
      const oc = document.getElementById("other-check");
      if (oc) oc.checked = ot.value.trim() !== "";
      else if (ot.value.trim()) {
        const r = card.querySelector(`input[name="${q.id}"][value="Anderes"]`);
        if (r) r.checked = true;
      }
    });
  }
}

// ---------- Antwort lesen + prüfen ----------
function collect(q) {
  if (q.type === "radio") {
    const c = card.querySelector(`input[name="${q.id}"]:checked`);
    return c ? c.value : "";
  }
  if (q.type === "scale") {
    const s = document.getElementById("slider");
    return s && s.dataset.touched === "1" ? s.value : "";
  }
  if (q.type === "checkbox") {
    const list = [...card.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i => i.value);
    const oc = document.getElementById("other-check"), ot = document.getElementById("other-text");
    if (oc && oc.checked && ot.value.trim()) list.push("Anderes: " + ot.value.trim());
    return list;
  }
  return document.getElementById("field").value.trim();
}

function validate(q, value) {
  if (q.type === "checkbox") {
    const oc = document.getElementById("other-check"), ot = document.getElementById("other-text");
    if (oc && oc.checked && !ot.value.trim()) return t("errOther");
    if (!value.length) return t("errPickMulti");
    if (q.exclusive && value.includes(q.exclusive) && value.length > 1) return t("errExcl", { x: opt(q.exclusive) });
    return "";
  }
  if (!value) return q.type === "scale" ? t("errSlider") : (q.type === "radio" || q.type === "select") ? t("errPick") : t("errAnswer");
  if (q.type === "radio" && q.other && value === "Anderes" && !document.getElementById("other-text").value.trim()) return t("errOther");
  if (q.type === "number") {
    const n = Number(value);
    if (!Number.isInteger(n) || n < q.min || n > q.max) return t("errNum", { a: q.min, b: q.max });
  }
  return "";
}

function save(q, value) {
  answers[q.id] = (q.type === "number" || q.type === "scale") ? Number(value) : value;
  if (q.extra) answers[q.extra.id] = document.getElementById("extra-field").value.trim();
  if (q.other) {
    const ot = document.getElementById("other-text");
    answers[q.id + "_anderes"] = (q.type === "radio" && value !== "Anderes") ? "" : ot.value.trim();
  }
}

// ---------- Navigation ----------
function goNext() {
  const q = questions[current];
  const value = collect(q);
  const err = validate(q, value);
  if (err) { document.getElementById("error").textContent = err; return; }
  save(q, value);
  const n = step(current, 1);
  if (n >= questions.length) return showResult();
  current = n;
  render();
}

function goBack() {
  const q = questions[current];
  const value = collect(q);
  if (value && value.length !== 0) save(q, value);
  current = Math.max(step(current, -1), 0);
  render();
}

document.getElementById("lang").addEventListener("change", e => {
  if (!done) {
    try { const q = questions[current], v = collect(q); if (v && v.length !== 0) save(q, v); } catch (_) {}
  }
  lang = e.target.value;
  applyStatic();
  render();
});

// ---------- Ergebnis ----------
function fmtAnswer(q, a) {
  if (q.type === "scale") return a + " / 100";
  if (Array.isArray(a)) return a.map(x => x.startsWith("Anderes: ") ? t("other") + ": " + x.slice(9) : opt(x)).join(", ");
  if (q.type === "radio" && a === "Anderes" && answers[q.id + "_anderes"]) return t("other") + ": " + answers[q.id + "_anderes"];
  return (q.options && q.options.includes(a)) ? opt(a) : a;
}

function showResult() {
  done = true;
  document.getElementById("lang").disabled = true;
  // Antworten übersprungener Fragen verwerfen
  const vis = questions.map((q, i) => visible(i));
  questions.forEach((q, i) => {
    if (!vis[i]) {
      delete answers[q.id]; delete answers[q.id + "_anderes"];
      if (q.extra) delete answers[q.extra.id];
    }
  });
  answers.sprache = lang;

  bar.style.width = "100%";
  progress.setAttribute("aria-valuenow", 100);
  counter.textContent = "";

  const rows = questions.map((q, i) => {
    if (!vis[i]) return "";
    const extra = q.extra && answers[q.extra.id] ? ` (${esc(answers[q.extra.id])})` : "";
    return `<dt>${i + 1}. ${esc(qText(q))}</dt><dd>${esc(fmtAnswer(q, answers[q.id]))}${extra}</dd>`;
  }).join("");

  card.innerHTML = `<div class="result">
    <h2>${esc(t("thanks"))}</h2>
    <p>${esc(t("summary"))}</p>
    <dl>${rows}</dl>
    <p class="error" id="send-status" role="status" style="color:var(--muted)">${esc(t("sending"))}</p>
    <div class="nav">
      <button type="button" class="btn-secondary" id="download">${esc(t("download"))}</button>
    </div></div>`;

  document.getElementById("download").addEventListener("click", download);
  sendAnswers();
}

async function sendAnswers() {
  const s = document.getElementById("send-status");
  try {
    await window.saveAnswers(answers);
    s.style.color = "var(--accent)";
    s.textContent = t("sent");
  } catch (err) {
    console.error(err);
    s.style.color = "var(--error)";
    s.textContent = t("failed");
  }
}

function download() {
  const blob = new Blob([JSON.stringify(answers, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "umfrage-antworten.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Start ----------
document.getElementById("lang").innerHTML = UI_LANGS.filter(([c]) => TR[c]).map(([c, n]) => `<option value="${c}">${n}</option>`).join("");
applyStatic();
render();
</script>
